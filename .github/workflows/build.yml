name: Build FatMaxxer SmO2 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Télécharger automatiquement la bibliothèque ANT+ manquante
        run: |
          mkdir -p app/libs
          rm -f app/libs/android_antlib_4-14-0.jar
          curl -fSL "https://raw.githubusercontent.com/kgurney/FatMaxxer/master/app/libs/android_antlib_4-14-0.jar" -o app/libs/android_antlib_4-14-0.jar || curl -fSL "https://raw.githubusercontent.com/kgurney/FatMaxxer/main/app/libs/android_antlib_4-14-0.jar" -o app/libs/android_antlib_4-14-0.jar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FatMaxxer-SmO2-APK
          path: app/build/outputs/apk/debug/app-debug.apk